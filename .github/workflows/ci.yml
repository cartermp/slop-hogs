name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['24.19.0', '25.9.0']
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: slophog
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: slophog_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U slophog -d slophog_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://slophog:test-only@localhost:5432/slophog_test
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Restore compiler caches
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .next/cache
            tsconfig.tsbuildinfo
          key: ${{ runner.os }}-node-${{ matrix.node }}-compiler-${{ hashFiles('package-lock.json') }}-${{ hashFiles('**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ matrix.node }}-compiler-${{ hashFiles('package-lock.json') }}-
      - run: npm ci --engine-strict --no-audit --no-fund
      - run: npm run check
      - run: npm run test:db
      - run: npm run smoke
      - name: Set up Docker Buildx
        if: matrix.node == '24.19.0'
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build Railway image
        if: matrix.node == '24.19.0'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          tags: slophog-ci
          cache-from: type=gha,scope=railway-image
          cache-to: type=gha,mode=max,scope=railway-image
      - name: Verify Railway image
        if: matrix.node == '24.19.0'
        env:
          DATABASE_URL: postgres://slophog:test-only@localhost:5432/slophog_test
        run: |
          docker run --rm --network host -e DATABASE_URL slophog-ci npm run db:migrate
          docker run --rm --network host -e DATABASE_URL slophog-ci npm run db:check
          export APP_ORIGIN=https://hogs.example
          export OAUTH_PRIVATE_KEY="$(openssl genpkey -algorithm EC -pkeyopt ec_paramgen_curve:P-256 2>/dev/null)"
          export OAUTH_ENCRYPTION_KEY="$(openssl rand -base64 32)"
          export TRUSTED_PROXY_COUNT=1
          docker run -d --name slophog-app --network host \
            -e DATABASE_URL -e PORT=4321 -e APP_ORIGIN -e OAUTH_PRIVATE_KEY \
            -e OAUTH_ENCRYPTION_KEY -e TRUSTED_PROXY_COUNT slophog-ci
          trap 'docker logs slophog-app; docker rm -f slophog-app' EXIT
          ready=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4321/api/health; then ready=1; break; fi
            sleep 1
          done
          test "$ready" = 1
          npm run smoke:deployed -- http://127.0.0.1:4321
          verify_command=$(docker exec slophog-app node scripts/check-persistence.ts seed)
          docker restart slophog-app
          docker exec slophog-app $verify_command
          if docker run --rm --network host -e DATABASE_URL=postgres://invalid:invalid@localhost:1/missing slophog-ci; then
            echo 'Production startup unexpectedly accepted an unreachable database'
            exit 1
          fi
