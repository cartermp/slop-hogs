name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['24.19.0', '25.9.0']
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: slophog
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: slophog_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U slophog -d slophog_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://slophog:test-only@localhost:5432/slophog_test
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --engine-strict
      - run: npm run check
      - run: npm run test:db
      - run: npm run build
      - run: npm run smoke
      - name: Build and verify Railway image
        if: matrix.node == '24.19.0'
        env:
          DATABASE_URL: postgres://slophog:test-only@localhost:5432/slophog_test
        run: |
          docker build -t slophog-ci .
          docker run --rm --network host -e DATABASE_URL slophog-ci npm run db:migrate
          docker run --rm --network host -e DATABASE_URL slophog-ci npm run db:check
          docker run -d --name slophog-app --network host -e DATABASE_URL -e PORT=4321 slophog-ci
          trap 'docker logs slophog-app; docker rm -f slophog-app' EXIT
          ready=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4321/api/health; then ready=1; break; fi
            sleep 1
          done
          test "$ready" = 1
          npm run smoke:deployed -- http://127.0.0.1:4321
          verify_command=$(docker exec slophog-app node scripts/check-persistence.ts seed)
          docker restart slophog-app
          docker exec slophog-app $verify_command
          if docker run --rm --network host -e DATABASE_URL=postgres://invalid:invalid@localhost:1/missing slophog-ci; then
            echo 'Production startup unexpectedly accepted an unreachable database'
            exit 1
          fi

  railway-diagnostics:
    if: github.head_ref == 'copilot/debug-railway-deployment'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: perfect-cat / production
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_PROJECT_ID: 40a3b05f-3d6c-4335-80c1-98be172d3236
      RAILWAY_ENVIRONMENT_ID: 85939c2a-0bc5-43ff-be6d-689ec1170c2f
      RAILWAY_SERVICE_ID: 3759c81d-a107-456b-aaeb-82fdc30fec30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm ci --engine-strict
      - name: Verify database reference
        run: |
          app_url=$(npx --yes @railway/cli@5.50.2 variable list \
            --project "$RAILWAY_PROJECT_ID" \
            --environment "$RAILWAY_ENVIRONMENT_ID" \
            --service slop-hogs \
            --json | jq -er '.DATABASE_URL')
          postgres_url=$(npx --yes @railway/cli@5.50.2 variable list \
            --project "$RAILWAY_PROJECT_ID" \
            --environment "$RAILWAY_ENVIRONMENT_ID" \
            --service Postgres \
            --json | jq -er '.DATABASE_URL')
          test "$app_url" = "$postgres_url"
          echo 'Application DATABASE_URL matches the Postgres service.'
      - name: Apply Railway configuration
        run: |
          npx --yes @railway/cli@5.50.2 config plan \
            --file .railway/railway.ts \
            --verbose
          npx --yes @railway/cli@5.50.2 config apply \
            --file .railway/railway.ts \
            --yes \
            --verbose
      - name: Deploy recovery checkout and wait
        run: |
          deployment() {
            npx --yes @railway/cli@5.50.2 deployment list \
              --project "$RAILWAY_PROJECT_ID" \
              --environment "$RAILWAY_ENVIRONMENT_ID" \
              --service slop-hogs \
              --limit 20 \
              --json |
              jq --arg id "$1" -er '.[] | select(.id == $id)'
          }

          upload=$(npx --yes @railway/cli@5.50.2 up . \
            --project "$RAILWAY_PROJECT_ID" \
            --environment "$RAILWAY_ENVIRONMENT_ID" \
            --service slop-hogs \
            --detach \
            --json \
            --message "Recover deployment from GitHub PR #${{ github.event.pull_request.number }}")
          id=$(printf '%s' "$upload" | jq -er '.deploymentId')
          echo "Uploaded recovery deployment $id"

          status=
          for attempt in $(seq 1 80); do
            status=$(deployment "$id" | jq -r '.status')
            case "$status" in
              SUCCESS) break ;;
              FAILED|CRASHED|REMOVED) break ;;
            esac
            sleep 5
          done

          npx --yes @railway/cli@5.50.2 logs \
            --project "$RAILWAY_PROJECT_ID" \
            --environment "$RAILWAY_ENVIRONMENT_ID" \
            --service slop-hogs \
            --deployment "$id" \
            --lines 300
          test "$status" = SUCCESS
      - name: Read latest Railway logs
        if: always()
        run: |
          npx --yes @railway/cli@5.50.2 logs \
            --project "$RAILWAY_PROJECT_ID" \
            --environment "$RAILWAY_ENVIRONMENT_ID" \
            --service slop-hogs \
            --build \
            --latest \
            --lines 300 || true
          npx --yes @railway/cli@5.50.2 logs \
            --project "$RAILWAY_PROJECT_ID" \
            --environment "$RAILWAY_ENVIRONMENT_ID" \
            --service slop-hogs \
            --deployment \
            --latest \
            --lines 300 || true
