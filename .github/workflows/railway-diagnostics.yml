name: Railway diagnostics

on:
  push:
    branches: [copilot/debug-railway-deployment]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: perfect-cat / production
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_PROJECT_ID: 40a3b05f-3d6c-4335-80c1-98be172d3236
      RAILWAY_ENVIRONMENT_ID: 85939c2a-0bc5-43ff-be6d-689ec1170c2f
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.19.0
      - name: Inspect project
        run: >-
          npx --yes @railway/cli@5.50.2 status
          --project "$RAILWAY_PROJECT_ID"
          --environment "$RAILWAY_ENVIRONMENT_ID"
          --json
      - name: List deployments
        run: >-
          npx --yes @railway/cli@5.50.2 deployment list
          --project "$RAILWAY_PROJECT_ID"
          --environment "$RAILWAY_ENVIRONMENT_ID"
          --service slop-hogs
          --limit 5
          --json
      - name: Read latest build logs
        if: always()
        run: >-
          npx --yes @railway/cli@5.50.2 logs
          --project "$RAILWAY_PROJECT_ID"
          --environment "$RAILWAY_ENVIRONMENT_ID"
          --service slop-hogs
          --build
          --latest
          --lines 300
      - name: Read latest deployment logs
        if: always()
        run: >-
          npx --yes @railway/cli@5.50.2 logs
          --project "$RAILWAY_PROJECT_ID"
          --environment "$RAILWAY_ENVIRONMENT_ID"
          --service slop-hogs
          --deployment
          --latest
          --lines 300
